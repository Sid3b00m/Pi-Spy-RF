server:
  # Use 127.0.0.1 for local-only. Use 0.0.0.0 to allow LAN access (enable auth!).
  host: "127.0.0.1"
  port: 8080

auth:
  # REQUIRED when host is 0.0.0.0 / LAN-exposed
  enabled: false
  username: "ops"
  password: ""   # prefer env: PI_SPY_PASSWORD

database:
  path: "data/pi_spy.db"

devices:
  prefer:
    - type: rtl-sdr
      role: scan
    - type: hackrf
      role: decode

wifi:
  interface: "wlan0"   # Linux; Windows/macOS may fall back to demo without nmcli/iw
  enabled: true

bluetooth:
  enabled: true

mac_db:
  oui_path: "data/oui.txt"
  known_path: "data/known_macs.json"

decode:
  enabled: true
  auto_from_spectrum: true
