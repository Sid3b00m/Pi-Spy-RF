server:
  # Use 127.0.0.1 for local-only. Use 0.0.0.0 to allow LAN access (enable auth!).
  host: "127.0.0.1"
  port: 8080

auth:
  # REQUIRED when host is 0.0.0.0 / LAN-exposed
  enabled: false
  username: "ops"
  password: ""   # prefer env: PI_SPY_PASSWORD

database:
  path: "data/pi_spy.db"

devices:
  prefer:
    - type: rtl-sdr
      role: scan
    - type: hackrf
      role: decode

wifi:
  interface: "wlan0"   # Linux; Windows/macOS may fall back to demo without nmcli/iw
  enabled: true

bluetooth:
  enabled: true

mac_db:
  oui_path: "data/oui.txt"
  known_path: "data/known_macs.json"

decode:
  enabled: true
  auto_from_spectrum: true

audio:
  # Live listening. Needs a radio set to role=audio, which is exclusive: one SDR
  # cannot scan and demodulate at the same time.
  enabled: true
  # RTL dongles go through rtl_fm. A HackRF has no packaged rtl_fm equivalent, so
  # its IQ is captured at sample_rate and demodulated in-process instead; audio
  # then comes out at sample_rate / 40. HackRF will not sample below 2000000.
  sample_rate: 2000000
  # Output rate for the rtl_fm / rx_fm backends.
  output_rate: 48000
  # How many browsers may listen to the one radio at once.
  max_listeners: 4

websdr:
  # Public receiver picker. Set enabled: false to keep the dashboard fully offline
  # (the panel then hides itself and no outbound request is ever made).
  enabled: true
  # The merged list is cached here, so a receiver with no internet still shows the
  # last known directory instead of an empty dropdown.
  cache_path: "data/websdr_receivers.json"
  refresh_minutes: 60
  stale_days: 30
  timeout_s: 12
  max_receivers: 4000
